name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    name: Build, test, and publish image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/forecast-pipeline:${{ github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v5
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GitHub Container Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/forecast-pipeline:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/forecast-pipeline:latest

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Tag image for Azure Container Registry
        run: |
          ACR_NAME=${{ secrets.AZURE_CONTAINER_REGISTRY }}
          ACR_IMAGE=${ACR_NAME}.azurecr.io/forecast-pipeline:${{ github.sha }}
          docker tag ghcr.io/${{ github.repository_owner }}/forecast-pipeline:${{ github.sha }} $ACR_IMAGE
          echo "ACR_IMAGE=$ACR_IMAGE" >> $GITHUB_ENV

      - name: Push to Azure Container Registry
        run: |
          ACR_NAME=${{ secrets.AZURE_CONTAINER_REGISTRY }}
          ACR_IMAGE=${ACR_NAME}.azurecr.io/forecast-pipeline:${{ github.sha }}
          echo "Logging in to ACR $ACR_NAME"
          az acr login --name $ACR_NAME
          docker push $ACR_IMAGE

      - name: Deploy to Azure Web App
        run: |
          ACR_NAME=${{ secrets.AZURE_CONTAINER_REGISTRY }}
          ACR_IMAGE=${ACR_NAME}.azurecr.io/forecast-pipeline:${{ github.sha }}
          az webapp config container set \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --docker-custom-image-name $ACR_IMAGE
          az webapp restart \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}

      - name: Output published image name
        run: echo "IMAGE=ghcr.io/${{ github.repository_owner }}/forecast-pipeline:${{ github.sha }}"
