name: Production MLOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-mlops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI and Static Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-airflow.txt

      - name: Validate Python sources
        run: |
          python -m compileall src/forecast_pipeline dags

      - name: Smoke-test application imports
        run: |
          python -c "from forecast_pipeline.server import app; print(app.title)"
          python -c "from forecast_pipeline.retrain_model import forecast_revenue; print('retrain engine imported')"

  build-and-publish:
    name: Build and Publish Docker Image
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v5
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/forecast-pipeline:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/forecast-pipeline:latest

  deploy-to-gcp:
    name: Deploy to Google Cloud Run
    needs: build-and-publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: Configure Docker credential helper
        run: |
          gcloud auth configure-docker gcr.io

      - name: Build and push Docker image to GCR
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/forecast-pipeline:${{ github.sha }} .
          docker tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/forecast-pipeline:${{ github.sha }} gcr.io/${{ secrets.GCP_PROJECT_ID }}/forecast-pipeline:latest
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/forecast-pipeline:${{ github.sha }}
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/forecast-pipeline:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy forecast-pipeline \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/forecast-pipeline:${{ github.sha }} \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --memory 512Mi \
            --timeout 300

      - name: Output Cloud Run URL
        run: |
          SERVICE_URL=$(gcloud run services describe forecast-pipeline --region ${{ secrets.GCP_REGION }} --format='value(status.url)')
          echo "GCP Cloud Run deployed at: $SERVICE_URL"

  deploy-to-azure:
    name: Deploy to Azure Web App
    needs: build-and-publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image locally
        run: |
          docker build -t forecast-pipeline:${{ github.sha }} .

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Tag image for Azure Container Registry
        run: |
          ACR_NAME=${{ secrets.AZURE_CONTAINER_REGISTRY }}
          ACR_IMAGE=${ACR_NAME}.azurecr.io/forecast-pipeline:${{ github.sha }}
          docker tag forecast-pipeline:${{ github.sha }} $ACR_IMAGE
          echo "ACR_IMAGE=$ACR_IMAGE" >> $GITHUB_ENV

      - name: Push to Azure Container Registry
        run: |
          ACR_NAME=${{ secrets.AZURE_CONTAINER_REGISTRY }}
          ACR_IMAGE=${ACR_NAME}.azurecr.io/forecast-pipeline:${{ github.sha }}
          az acr login --name $ACR_NAME
          docker push $ACR_IMAGE

      - name: Configure Azure Web App container
        run: |
          ACR_NAME=${{ secrets.AZURE_CONTAINER_REGISTRY }}
          ACR_IMAGE=${ACR_NAME}.azurecr.io/forecast-pipeline:${{ github.sha }}
          az webapp config container set \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --docker-custom-image-name $ACR_IMAGE

      - name: Restart Azure Web App
        run: |
          az webapp restart \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}

      - name: Output Azure Web App URL
        run: |
          echo "Azure Web App deployed to: https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net"
